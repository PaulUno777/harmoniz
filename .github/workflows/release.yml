name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            artifact: macos
          - os: windows-latest
            platform: windows/amd64
            artifact: windows
          - os: ubuntu-latest
            platform: linux/amd64
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          jq --arg v "$VERSION" '.info.productVersion = $v' wails.json > wails.json.tmp && mv wails.json.tmp wails.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev gcc

      - name: Install NSIS
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Add NSIS to PATH
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS"
          if (-not (Test-Path "$nsis\makensis.exe")) {
            throw "makensis.exe not found after NSIS install (expected $nsis)"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $nsis

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Add Go bin to PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Build macOS app
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          wails build -platform darwin/universal -o harmoniz -ldflags "-X harmoniz/internal/version.Version=${VERSION}"
          ditto -c -k --keepParent build/bin/harmoniz.app build/bin/harmoniz.app.zip

      - name: Build Windows installer
        if: matrix.os == 'windows-latest'
        shell: bash
        run: wails build -platform windows/amd64 -webview2 embed -nsis -o harmoniz -ldflags "-X harmoniz/internal/version.Version=${VERSION}"

      - name: Verify Windows installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $installer = "build/bin/harmoniz-amd64-installer.exe"
          if (-not (Test-Path $installer)) {
            Write-Host "Contents of build/bin:"
            Get-ChildItem build/bin -ErrorAction SilentlyContinue
            throw "Installer not found at $installer (is makensis on PATH?)"
          }

      - name: Build Linux binary
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          wails build -platform linux/amd64 -tags webkit2_41 -o harmoniz -ldflags "-X harmoniz/internal/version.Version=${VERSION}"
          cd build/bin
          tar -czf harmoniz-linux-amd64.tar.gz harmoniz

      - name: Upload macOS artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/bin/harmoniz.app.zip

      - name: Upload Windows artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/bin/harmoniz-amd64-installer.exe

      - name: Upload Linux artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/bin/harmoniz-linux-amd64.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract changelog
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if awk "/^## \\[$VERSION\\]/{flag=1; next} /^## \\[/{flag=0} flag" CHANGELOG.md | grep -q .; then
            awk "/^## \\[$VERSION\\]/{flag=1; next} /^## \\[/{flag=0} flag" CHANGELOG.md > release_notes.md
          else
            echo "Release v${VERSION}" > release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            artifacts/**
